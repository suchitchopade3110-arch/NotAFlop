name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      # Scoped to syntax errors and undefined names (E9/F63/F7/F82) rather
      # than the full default ruleset — the existing codebase predates
      # this phase and carries some pre-existing style debt (unused
      # imports etc.) this frontend-focused phase doesn't touch. This
      # ruleset still catches anything that would actually break at
      # runtime.
      - name: Lint (ruff)
        run: ruff check . --select=E9,F63,F7,F82

      # `python -m pytest`, not the bare `pytest` console script: the
      # `-m` form prepends the current directory to sys.path, which is
      # what makes `from services import ...` (and every other
      # top-level-package import in tests/conftest.py) resolve. The bare
      # command doesn't do that and fails with "No module named
      # 'services'" — confirmed against the actual CI failure.
      - name: Test (pytest)
        run: python -m pytest -q

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://example.com
